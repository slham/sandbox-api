openapi: 3.0.0
servers:
  - url: https://localhost
info:
  version: "1.0.0"
  title: Sheldon Sandbox
  description: The API for Sheldon Sandbox
tags:
  - name: Auth
  - name: User
  - name: Workout
paths:
  /login:
    post:
      tags:
        - Auth
      summary: Logs in and returns the authentication  cookie
      requestBody:
        required: true
        description: A JSON object containing the login and password.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      security: [] # no authentication
      responses:
        "200":
          description: >
            Successfully authenticated.
            The session ID is returned in a cookie named `sandbox-cookie`. You need to include this cookie in subsequent requests.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sandbox-cookie=abcde12345; Path=/; HttpOnly
  /users:
    post:
      tags:
        - User
      description: create a user
      security: [] # no authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    get:
      tags:
        - User
      description: returns all users
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/sortParam'
        - $ref: '#/components/parameters/sortColParam'
      responses:
        '200':
          description: All the users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  "/users/{user_id}":
    get:
      tags:
        - User
      description: return a user
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
        - User
      description: update a user
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags:
        - User
      description: delete a user
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  "/users/{user_id}/workouts":
    post:
      tags:
        - Workout
      description: create a user
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
    get:
      tags:
        - Workout
      description: returns all user's workouts
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/sortParam'
        - $ref: '#/components/parameters/sortColParam'
      responses:
        '200':
          description: All the workouts for a user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workout'
  "/users/{user_id}/workouts/{workout_id}":
    get:
      tags:
        - Workout
      description: return a workout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
        - $ref: '#/components/parameters/workoutIDParam'
      responses:
        '200':
          description: The workout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
    patch:
      tags:
        - Workout
      description: update a workout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
        - $ref: '#/components/parameters/workoutIDParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkoutRequest"
      responses:
        '200':
          description: The workout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
    delete:
      tags:
        - Workout
      description: delete a workout
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/userIDParam'
        - $ref: '#/components/parameters/workoutIDParam'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
components:
  parameters:
    limitParam:
      name: limit
      in: query
      description: Limits the number of resources returned
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    offsetParam:
      name: offset
      in: query
      description: Offsets starting point of resources returned
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    sortParam:
      name: sort
      in: query
      description: Sort order
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    sortColParam:
      name: sort_column
      in: query
      description: Field to sort by
      required: false
      schema:
        type: string
        enum:
          - created
          - updated
          - id
        default: updated
    idParam:
      name: id
      in: query
      description: Resource ID
      required: false
      schema:
        type: string
    emailParam:
      name: email
      in: query
      description: User's email
      required: false
      schema:
        type: string
    userIDParam:
      name: user_id
      in: path
      description: User ID associated with child resource
      schema:
        type: string
      required: true
    workoutIDParam:
      name: workout_id
      in: path
      description: Workout ID
      schema:
        type: string
      required: true
  responses:
    '200':
      description: OK
    '201':
      description: Created
    '204':
      description: No Content
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
    '500':
      description: Internal Server Error
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 'user_2rKlnIoWMG72B6UQXC7aSNPMZjQ'
        username:
          type: string
          example: 'iamhim'
        email:
          type: string
          example: 'a@b.com'
        created:
          type: string
          example: '2009-11-10T23:00:00Z'
        updated:
          type: string
          example: '2009-11-10T23:00:00Z'
        isActive:
          type: boolean
          example: true
        isSuspended:
          type: boolean
          example: false
        isVerified:
          type: boolean
          example: true
        roles:
          type: array
          items: 
            $ref: '#/components/schemas/Role'
    Role:
      type: object
      properties:
        id: 
          type: integer
          example: 7
        name:
          type: string
          example: 'CIVILIAN'
        created:
          type: string
          example: '2009-11-10T23:00:00Z'
        updated:
          type: string
          example: '2009-11-10T23:00:00Z'
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          example: 'iamhim'
        password:
          type: string
          example: 'TheyW1llN3v3r_guessME!'
        email:
          type: string
          example: 'a@b.com'
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          example: 'supersecretpassword'
        email:
          type: string
          example: 'a@b.com'
    Workout:
      type: object
      properties:
        id:
          type: string
          example: 'work_2rH4AilsxEL75kAs2Qb3KVv7Sm9'
        name:
          type: string
          example: 'leg day 1'
        user_id:
          type: string
          example: 'user_2rKlnIoWMG72B6UQXC7aSNPMZjQ'
        created:
          type: string
          example: '2009-11-10T23:00:00Z'
        updated:
          type: string
          example: '2009-11-10T23:00:00Z'
        exercises:
          type: array
          items: 
            $ref: '#/components/schemas/Exercise'
    Exercise:
      type: object
      properties:
        name:
          type: string
          example: 'squat'
        muscles:
          type: array
          items: 
            $ref: '#/components/schemas/Muscle'
        sets:
          type: array
          items: 
            $ref: '#/components/schemas/Set'
    Muscle:
      type: object
      properties:
        name:
          type: string
          example: 'quad'
        muscleGroup:
          type: string
          enum:
            - 'arms'
            - 'back'
            - 'chest'
            - 'core'
            - 'heart'
            - 'legs'
            - 'shoulders'
    Set:
      type: object
      properties:
        weight:
          type: integer
          format: float
          example: '20.5'
        reps:
          type: integer
          format: int32
          example: '8'
    CreateWorkoutRequest:
      type: object
      properties:
        name:
          type: string
          example: 'leg day 1'
        exercises:
          type: array
          items: 
            $ref: '#/components/schemas/Exercise'
    UpdateWorkoutRequest:
      type: object
      properties:
        name:
          type: string
          example: 'leg day 1'
        exercises:
          type: array
          items: 
            $ref: '#/components/schemas/Exercise'
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: 'iamhim'
        password:
          type: string
          example: 'TheyW1llN3v3r_guessME!'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sandbox-cookie
